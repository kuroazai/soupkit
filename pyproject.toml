[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soupkit"
version = "0.2.0"
description = "A small, polite web-scraping toolkit built on BeautifulSoup"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Fidelis Mwansa" }]
keywords = ["scraping", "beautifulsoup", "bs4", "html", "robots-txt", "rate-limiting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = ["beautifulsoup4>=4.11", "requests>=2.28", "urllib3>=1.26"]

[project.optional-dependencies]
lxml = ["lxml>=4.9"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "mypy>=1.8", "types-requests"]

[project.urls]
Homepage = "https://github.com/kuroazai/soupkit"

[tool.hatch.build.targets.wheel]
packages = ["src/soupkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# 3.12: urllib3/requests stubs in some environments use PEP 695 syntax that
# older target versions cannot parse. The package itself supports 3.10+.
python_version = "3.12"
files = ["src/soupkit"]
ignore_missing_imports = true
